<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReelGuard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .counter-value {
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      margin: 8px 0;
    }
    .counter-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    .limit-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }
    input[type="number"] {
      width: 60px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-save {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-reset {
      background: #334155;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛡️ ReelGuard</div>
    <span style="font-size: 11px; color: #64748b;">BrainPal Web</span>
  </div>

  <div class="card">
    <div class="counter-sub">Reels Watched Today</div>
    <div class="counter-value" id="todayCount">0</div>
    <div class="counter-sub" id="limitNotice">Target: under 20</div>
  </div>

  <div class="limit-section">
    <label for="limitInput">Daily Limit:</label>
    <input type="number" id="limitInput" min="1" max="500" value="20">
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn-save">Save Limit</button>
    <button id="resetBtn" class="btn-reset">Reset Today</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
